<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting…</title>
<script src="data/categories.js"></script>
<script>
/* Old quiz.html URLs (?quiz=, ?r=, ?mode=browse) now live under ?path=. */
(function () {
  var CATS = (window.LOC_CATEGORIES || []).map(function (c) { return c.id; });
  function qp(n) {
    try { return new URLSearchParams(location.search).get(n); } catch (e) { return null; }
  }
  function catpath(key) {
    for (var i = 0; i < CATS.length; i++) {
      if (key === CATS[i]) return CATS[i];
      if (key.indexOf(CATS[i] + "-") === 0) return CATS[i] + "/" + key.slice(CATS[i].length + 1);
    }
    return null;
  }
  var dest = "?path=quiz";
  var r = qp("r"), quiz = qp("quiz"), browse = qp("mode") === "browse";
  if (r) dest = "?path=share/" + r;
  else if (quiz) {
    var cp = catpath(quiz);
    dest = cp ? "?path=" + cp + "/" + (browse ? "browse" : "quiz") : "?path=quiz";
  }
  location.replace("./" + dest);
})();
</script>
</head>
<body><p><a href="./?path=quiz">Continue</a></p></body>
</html>
