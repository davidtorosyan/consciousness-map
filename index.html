<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Landscape of Consciousness</title>
<meta name="description" content="Eleven families of theories about what consciousness is — find the view that sounds closest. Names and colors follow the official Landscape of Consciousness.">
<meta name="theme-color" content="#04060a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{background:#04060a;margin:0}</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="dots"></div></div>
<main id="app" class="wrap"></main>
<script>
/* Cache-busting loader. GitHub Pages lets browsers cache every file,
   this page included, for 10 minutes. So instead of stamping versions into
   this file, ask version.json (bypassing the cache) which build is live and
   load the assets with ?v=<build>. deploy.sh writes version.json; the
   committed value "dev" means "never cache" (local work, unstamped pushes). */
(function () {
  "use strict";
  var CSS = ["styles.css", "quiz.css"];
  var JS = ["data/categories.js", "data/quiz-data.js", "data/main-quiz.js", "core.js", "app.js", "quiz.js", "saved.js", "history.js"];
  function load(build) {
    window.CM_BUILD = build;
    var q = "?v=" + encodeURIComponent(build === "dev" ? String(Date.now()) : build);
    var pending = CSS.length + JS.length;
    function done() { if (--pending === 0) { CM.start(); window.CM_READY = true; } }
    CSS.forEach(function (href) {
      var el = document.createElement("link");
      el.rel = "stylesheet";
      el.href = href + q;
      el.onload = el.onerror = done;
      document.head.appendChild(el);
    });
    JS.forEach(function (src) {
      var el = document.createElement("script");
      el.src = src + q;
      el.async = false;   // run in list order
      el.onload = done;
      el.onerror = function () { document.getElementById("app").textContent = "Couldn’t load " + src + ". Try reloading."; };
      document.body.appendChild(el);
    });
  }
  fetch("version.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) { load(String(j.v || "dev")); }, function () { load("dev"); });
})();
</script>
</body>
</html>
